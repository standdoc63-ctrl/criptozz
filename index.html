<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Only Crypto</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-gradient: linear-gradient(160deg, #0f0f0f, #181818, #0d0d0d);
            --text-primary: #f0f0f0;
            --text-muted: #6b7280;
            --divider: #ef4444;
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-border: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: max(20px, env(safe-area-inset-top, 20px));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100dvh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            padding-top: var(--safe-top);
            overflow-y: auto;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        /* ===== BAŞLIQ ===== */
        .header {
            width: 100%;
            padding: 20px 16px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .logo {
            font-size: clamp(1.1rem, 4.5vw, 1.35rem);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .red-line {
            width: 45px;
            height: 3px;
            background: var(--divider);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ===== BUTONLAR ===== */
        .nav-wrapper {
            width: 100%;
            padding: 10px 8px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 440px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex: 1;
            padding: 10px 6px;
            font-size: clamp(0.65rem, 2.4vw, 0.75rem);
            font-weight: 600;
            letter-spacing: 0.4px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius);
            background: var(--btn-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            backdrop-filter: blur(6px);
            touch-action: manipulation;
        }

        .btn svg {
            width: clamp(14px, 4vw, 16px);
            height: clamp(14px, 4vw, 16px);
            stroke-width: 2;
            fill: none;
            stroke: currentColor;
            flex-shrink: 0;
        }

        /* Hover & Active Rənglər */
        .btn-buy:active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #34d399; }
        .btn-market:active { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #fbbf24; }
        .btn-profile:active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa; }
        .btn-deposit:active { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; color: #a78bfa; }
        .btn-settings:active { background: rgba(107, 114, 128, 0.25); border-color: #6b7280; color: #9ca3af; }

        /* ===== AYIRICI XƏT ===== */
        .divider {
            width: 80%;
            max-width: 400px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            margin: 8px auto 0;
            flex-shrink: 0;
        }

        /* ===== AŞAĞI HİSSƏ ===== */
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-label {
            color: #2a2a2a;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px dashed #1a1a1a;
            padding: 8px 16px;
            border-radius: 8px;
        }

        @media (max-width: 360px) {
            .btn { padding: 9px 4px; gap: 4px; }
            .logo { letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="logo">Only Crypto</h1>
        <div class="red-line"></div>
    </header>

    <nav class="nav-wrapper">
        <div class="nav-buttons">
            <button class="btn btn-buy">
                <svg viewBox="0 0 24 24"><path d="M7 16V4m0 12l-4-4m4 4l4-4M17 8v12m0-12l4 4m-4-4l-4 4"/></svg>
                <span>Buy / Sell</span>
            </button>
            <button class="btn btn-market">
                <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-9"/></svg>
                <span>Market</span>
            </button>
            <button class="btn btn-profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </button>
            <button class="btn btn-deposit">
                <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><path d="M12 15v-4m0 0l-2 2m2-2l2 2"/></svg>
                <span>Deposit</span>
            </button>
            <button class="btn btn-settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Settings</span>
            </button>
        </div>
    </nav>

    <div class="divider"></div>

    <main class="content">
        <span class="test-label">test</span>
    </main>

</body>
</html>
