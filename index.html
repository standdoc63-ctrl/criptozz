<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Only Crypto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(160deg, #0f0f0f, #181818, #0d0d0d);
            --text: #f0f0f0;
            --muted: #6b7280;
            --accent: #ef4444;
            --btn-bg: rgba(255,255,255,0.03);
            --btn-border: rgba(255,255,255,0.08);
            --radius: 12px;
            --safe-top: max(16px, env(safe-area-inset-top, 16px));
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); min-height: 100dvh; color: var(--text); display:flex; flex-direction:column; align-items:center; padding-top: var(--safe-top); overflow-y:auto; }
        body::-webkit-scrollbar { display:none; }

        .header { width:100%; padding:14px 16px 8px; text-align:center; flex-shrink:0; }
        .logo { font-size: clamp(1.05rem, 4vw, 1.25rem); font-weight:700; letter-spacing:3px; text-transform:uppercase; background: linear-gradient(90deg, #fff, #9ca3af); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .red-line { width:40px; height:3px; background:var(--accent); margin:8px auto 0; border-radius:2px; }

        .nav-wrapper { width:100%; padding:8px 6px; display:flex; justify-content:center; flex-shrink:0; }
        .nav-buttons { display:flex; gap:6px; width:100%; max-width:440px; }
        .btn { display:flex; align-items:center; justify-content:center; gap:5px; flex:1; padding:10px 6px; font-size: clamp(0.65rem, 2.2vw, 0.75rem); font-weight:600; letter-spacing:0.4px; border:1px solid var(--btn-border); border-radius:var(--radius); background:var(--btn-bg); color:var(--muted); cursor:pointer; transition:0.2s; white-space:nowrap; touch-action:manipulation; }
        .btn svg { width: clamp(14px, 3.8vw, 16px); height: clamp(14px, 3.8vw, 16px); stroke-width:2; fill:none; stroke:currentColor; flex-shrink:0; }
        .btn-buy:active { background:rgba(16,185,129,0.2); border-color:#10b981; color:#34d399; }
        .btn-market:active { background:rgba(245,158,11,0.2); border-color:#f59e0b; color:#fbbf24; }
        .btn-profile:active { background:rgba(59,130,246,0.2); border-color:#3b82f6; color:#60a5fa; }
        .btn-deposit:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#a78bfa; }
        .btn-settings:active { background:rgba(107,114,128,0.25); border-color:#6b7280; color:#9ca3af; }

        .divider { width:80%; max-width:400px; height:2px; background:linear-gradient(90deg, transparent, #ef4444, transparent); margin:6px auto 0; flex-shrink:0; }

        .content { flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
        .test-label { color:#2a2a2a; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; border:1px dashed #1a1a1a; padding:8px 16px; border-radius:8px; }

        /* MODAL */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:999; display:none; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity 0.2s; }
        .modal-overlay.active { display:flex; opacity:1; }
        .modal-card { background:#141414; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; width:100%; max-width:320px; color:var(--text); position:relative; transform:scale(0.96); transition:transform 0.2s; }
        .modal-overlay.active .modal-card { transform:scale(1); }
        .modal-close { position:absolute; top:12px; right:12px; background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer; }
        .modal-title { text-align:center; font-size:1.1rem; font-weight:600; letter-spacing:1px; margin-bottom:16px; }
        .profile-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.8rem; }
        .profile-row:last-of-type { border-bottom:none; }
        .p-label { color:var(--muted); }
        .p-value { font-weight:500; text-align:right; max-width:60%; word-break:break-all; }
        .btn-logout { width:100%; margin-top:16px; padding:11px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-weight:600; font-size:0.8rem; cursor:pointer; touch-action:manipulation; }
        .btn-logout:active { transform:scale(0.98); opacity:0.9; }
        .no-user-msg { text-align:center; color:var(--accent); font-size:0.85rem; margin:20px 0; }
    </style>

    <!-- ⚡ İNSTANT SESSION YOXLANIŞI (Ağ ekranın qarşısını alır) -->
    <script>
        if (!localStorage.getItem('crypto_user')) {
            window.location.replace('crypto.html');
        }
    </script>
</head>
<body>

    <!-- 🛡️ F12 / DEVTOOLS QORUNMASI -->
    <script>
        (() => {
            const n = () => {}; console.log = console.info = console.warn = console.error = console.debug = n;
            setInterval(() => console.clear(), 2000);
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) e.preventDefault();
            });
            setInterval(() => { if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ef4444;font-size:1.5rem;background:#0a0a0a;">🚫 Access Restricted</div>'; }, 600);
        })();
    </script>

    <!-- UI -->
    <header class="header">
        <h1 class="logo">Only Crypto</h1>
        <div class="red-line"></div>
    </header>

    <nav class="nav-wrapper">
        <div class="nav-buttons">
            <button class="btn btn-buy" onclick="alert('Tezliklə aktiv olacaq')"><svg viewBox="0 0 24 24"><path d="M7 16V4m0 12l-4-4m4 4l4-4M17 8v12m0-12l4 4m-4-4l-4 4"/></svg><span>Buy / Sell</span></button>
            <button class="btn btn-market" onclick="alert('Tezliklə aktiv olacaq')"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-9"/></svg><span>Market</span></button>
            <button class="btn btn-profile"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></button>
            <button class="btn btn-deposit" onclick="alert('Tezliklə aktiv olacaq')"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><path d="M12 15v-4m0 0l-2 2m2-2l2 2"/></svg><span>Deposit</span></button>
            <button class="btn btn-settings" onclick="alert('Tezliklə aktiv olacaq')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
        </div>
    </nav>

    <div class="divider"></div>

    <main class="content">
        <span class="test-label">test</span>
    </main>

    <!-- PROFİL MODALI -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            <h3 class="modal-title">User Profile</h3>
            <div id="profile-data"></div>
            <button id="logout-btn" class="btn-logout" onclick="logoutUser()">Logout</button>
        </div>
    </div>

    <!-- ⚡ ƏSAS JAVASCRIPT -->
    <script>
        // Telegram Init
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }

        const modal = document.getElementById('profile-modal');
        const dataBox = document.getElementById('profile-data');

        document.querySelector('.btn-profile').addEventListener('click', () => {
            const raw = localStorage.getItem('crypto_user');
            if (!raw) { window.location.replace('crypto.html'); return; }
            const user = JSON.parse(raw);
            const regDate = new Date(user.registered_at).toLocaleString('az-AZ', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
            dataBox.innerHTML = `
                <div class="profile-row"><span class="p-label">Username</span><span class="p-value">${escapeHtml(user.username)}</span></div>
                <div class="profile-row"><span class="p-label">Email</span><span class="p-value">${escapeHtml(user.email)}</span></div>
                <div class="profile-row"><span class="p-label">Phone</span><span class="p-value">${escapeHtml(user.phone)}</span></div>
                <div class="profile-row"><span class="p-label">Registered</span><span class="p-value">${regDate}</span></div>
            `;
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('active'));
        });

        modal.addEventListener('click', e => { if (e.target === modal) closeProfileModal(); });

        function closeProfileModal() {
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 200);
        }

        function logoutUser() {
            localStorage.removeItem('crypto_user');
            // Admin sessiyası da varsa təmizlə
            localStorage.removeItem('admin_session');
            // Instant yönləndirmə (geri düyməsi ilə qayıtmağın qarşısını alır)
            window.location.replace('crypto.html');
        }

        function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
    </script>
</body>
</html>
