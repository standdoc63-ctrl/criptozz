<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Only Crypto</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-gradient: linear-gradient(160deg, #121212, #1a1a1a, #141414);
            --text-primary: #f0f0f0;
            --text-muted: #6b7280;
            --divider: #ef4444;
            --btn-bg: rgba(255, 255, 255, 0.04);
            --btn-border: rgba(255, 255, 255, 0.08);
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ===== BAŞLIQ ===== */
        .header {
            width: 100%;
            padding: 24px 16px 12px;
            text-align: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .red-line {
            width: 50px;
            height: 3px;
            background: var(--divider);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ===== BUTONLAR ===== */
        .nav-wrapper {
            width: 100%;
            padding: 12px 8px;
            display: flex;
            justify-content: center;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 420px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-buttons::-webkit-scrollbar { display: none; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 65px;
            padding: 10px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius);
            background: var(--btn-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            backdrop-filter: blur(6px);
        }

        .btn svg {
            width: 15px;
            height: 15px;
            stroke-width: 2;
            fill: none;
            stroke: currentColor;
            transition: var(--transition);
        }

        /* Button Hover & Accent Colors */
        .btn-buy:hover, .btn-buy:active { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #34d399; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .btn-market:hover, .btn-market:active { background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; color: #fbbf24; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
        .btn-profile:hover, .btn-profile:active { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #60a5fa; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); }
        .btn-deposit:hover, .btn-deposit:active { background: rgba(139, 92, 246, 0.15); border-color: #8b5cf6; color: #a78bfa; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25); }
        .btn-settings:hover, .btn-settings:active { background: rgba(107, 114, 128, 0.2); border-color: #6b7280; color: #9ca3af; box-shadow: 0 4px 12px rgba(107, 114, 128, 0.2); }

        /* ===== AYIRICI XƏT ===== */
        .divider {
            width: 80%;
            max-width: 400px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            margin: 8px auto 0;
        }

        /* ===== AŞAĞI HİSSƏ ===== */
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .test-label {
            color: #3a3a3a;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px dashed #2a2a2a;
            padding: 8px 16px;
            border-radius: 8px;
        }

        /* Mobil Optimizasiya */
        @media (max-width: 360px) {
            .logo { font-size: 1.1rem; letter-spacing: 4px; }
            .btn { padding: 9px 8px; font-size: 0.7rem; gap: 5px; }
            .btn svg { width: 13px; height: 13px; }
        }
    </style>
</head>
<body>

    <!-- BAŞLIQ -->
    <header class="header">
        <h1 class="logo">Only Crypto</h1>
        <div class="red-line"></div>
    </header>

    <!-- NAVİQASİYA -->
    <nav class="nav-wrapper">
        <div class="nav-buttons">
            <button class="btn btn-buy">
                <svg viewBox="0 0 24 24"><path d="M7 16V4m0 12l-4-4m4 4l4-4M17 8v12m0-12l4 4m-4-4l-4 4"/></svg>
                <span>Buy / Sell</span>
            </button>
            <button class="btn btn-market">
                <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-9"/></svg>
                <span>Market</span>
            </button>
            <button class="btn btn-profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </button>
            <button class="btn btn-deposit">
                <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><path d="M12 15v-4m0 0l-2 2m2-2l2 2"/></svg>
                <span>Deposit</span>
            </button>
            <button class="btn btn-settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Settings</span>
            </button>
        </div>
    </nav>

    <!-- AYIRICI -->
    <div class="divider"></div>

    <!-- BOŞ SAHƏ / TEST -->
    <main class="content">
        <span class="test-label">test</span>
    </main>

</body>
</html>
