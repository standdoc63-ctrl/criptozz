<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Only Crypto - Auth</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0a0a0a; --text: #f0f0f0; --muted: #6b7280; --accent: #ef4444; --input-bg: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(160deg, #0f0f0f, #181818, #0d0d0d); min-height:100dvh; color: var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 20px; }
        .card { width:100%; max-width:380px; background: rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:16px; padding:24px; backdrop-filter: blur(12px); }
        h2 { text-align:center; margin-bottom:6px; font-size:1.2rem; letter-spacing:1px; }
        .sub { text-align:center; color: var(--muted); font-size:0.8rem; margin-bottom:18px; }
        .field { margin-bottom:12px; }
        .field label { display:block; font-size:0.7rem; color: var(--muted); margin-bottom:5px; letter-spacing:0.5px; text-transform:uppercase; }
        .field input { width:100%; padding:12px; background: var(--input-bg); border:1px solid var(--border); border-radius:10px; color: var(--text); font-size:0.85rem; outline:none; transition:0.2s; }
        .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(239,68,68,0.2); }
        .btn { width:100%; padding:13px; background: var(--accent); color:#fff; border:none; border-radius:10px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:0.2s; margin-top:8px; touch-action: manipulation; }
        .btn:active { transform: scale(0.98); opacity:0.9; }
        .switch { text-align:center; margin-top:14px; font-size:0.75rem; color: var(--muted); }
        .switch a { color: #60a5fa; text-decoration:none; margin-left:4px; cursor:pointer; }
        .hidden { display:none; }
        .msg { text-align:center; font-size:0.7rem; min-height:1.1em; margin-top:8px; word-break: break-word; }
        .msg.err { color:#ef4444; }
        .msg.ok { color:#10b981; }
        .admin-hint { text-align:center; font-size:0.65rem; color:#2a2a2a; margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }
    </style>
</head>
<body>
    <div class="card">
        <form id="reg-form">
            <h2>Create Account</h2>
            <p class="sub">Join Only Crypto</p>
            <div class="field"><label>Username</label><input type="text" id="r-user" required autocomplete="username"></div>
            <div class="field"><label>Email (Gmail)</label><input type="email" id="r-email" required autocomplete="email"></div>
            <div class="field"><label>Phone</label><input type="tel" id="r-phone" required autocomplete="tel"></div>
            <div class="field"><label>Password</label><input type="password" id="r-pass" required minlength="6" autocomplete="new-password"></div>
            <button type="submit" class="btn">Register</button>
            <div id="r-msg" class="msg"></div>
            <div class="switch">Already have an account? <a id="to-login">Login</a></div>
        </form>

        <form id="log-form" class="hidden">
            <h2>Welcome Back</h2>
            <p class="sub">Sign in to your account</p>
            <div class="field"><label>Username</label><input type="text" id="l-user" required autocomplete="username"></div>
            <div class="field"><label>Password</label><input type="password" id="l-pass" required autocomplete="current-password"></div>
            <button type="submit" class="btn">Login</button>
            <div id="l-msg" class="msg"></div>
            <div class="switch">Don't have an account? <a id="to-reg">Register</a></div>
        </form>
        <div class="admin-hint">🔐 Secure access</div>
    </div>

    <script>
        // 🛡️ TƏHLÜKƏSİZLİK QATI (Anti-F12 & Obfuscation)
        (() => {
            // 1. Console & DevTools Protection
            const noop = () => {};
            console.log = noop; console.info = noop; console.warn = noop; console.error = noop; console.debug = noop;
            setInterval(() => console.clear(), 2000);

            // 2. F12 & DevTools Detection
            let devtoolsOpen = false;
            const detect = () => {
                const w = window.outerWidth - window.innerWidth > 160;
                const h = window.outerHeight - window.innerHeight > 160;
                if (w || h) { devtoolsOpen = true; document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;font-size:1.2rem;">🚫 Access Restricted</div>'; }
            };
            setInterval(detect, 800);

            // 3. Block Right Click & Shortcuts
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                    e.preventDefault();
                }
            });
        })();

        // 🔐 Şifrələnmiş İstifadəçi Məlumatları (Runtime Decode)
        const _u = String.fromCharCode(65,100,109,105,110); // "Admin"
        const _p = String.fromCharCode(122,120,99,118,49,50,113); // "zxcv12q"
        Object.defineProperty(window, '_u', { writable:false, configurable:false, enumerable:false });
        Object.defineProperty(window, '_p', { writable:false, configurable:false, enumerable:false });

        // 🔒 Giriş Cəhdi Limiti
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 3;
        let isLocked = false;

        // Telegram Init
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }

        const regForm = document.getElementById('reg-form');
        const logForm = document.getElementById('log-form');
        const rMsg = document.getElementById('r-msg');
        const lMsg = document.getElementById('l-msg');

        document.getElementById('to-login').onclick = () => { regForm.classList.add('hidden'); logForm.classList.remove('hidden'); rMsg.textContent=''; lMsg.textContent=''; };
        document.getElementById('to-reg').onclick = () => { logForm.classList.add('hidden'); regForm.classList.remove('hidden'); rMsg.textContent=''; lMsg.textContent=''; };

        const maskEmail = e => { const [u,d]=e.split('@'); return `${u[0]}***@${d[0]}***.com`; };
        const maskPhone = p => p.length<4?'****':`${p.slice(0,3)}***${p.slice(-4)}`;
        const simpleHash = s => { let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i); return 'h_'+Math.abs(h).toString(36); };

        // 🔹 QEYDİYYAT
        regForm.onsubmit = e => {
            e.preventDefault();
            const user = document.getElementById('r-user').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const pass = document.getElementById('r-pass').value;
            if(pass.length<6){ rMsg.className='msg err'; rMsg.textContent='Parol ən az 6 simvol olmalıdır.'; return; }
            let users = JSON.parse(localStorage.getItem('onlycrypto_users')||'[]');
            if(users.find(u=>u.username.toLowerCase()===user.toLowerCase())){ rMsg.className='msg err'; rMsg.textContent='İstifadəçi adı mövcuddur.'; return; }
            users.push({ 
            id:Date.now(), 
            username:user, 
            email, 
            phone, 
            email_masked:maskEmail(email), 
            phone_masked:maskPhone(phone), 
            password_hash:simpleHash(pass), 
            password_enc: btoa(pass), // 👈 BU SƏTRİ ƏLAVƏ EDİN
            registered_at:new Date().toISOString() 
        });
            localStorage.setItem('onlycrypto_users', JSON.stringify(users));
            rMsg.className='msg ok'; rMsg.textContent='Uğurla qeydiyyatdan keçdiniz!';
            setTimeout(()=>{ regForm.classList.add('hidden'); logForm.classList.remove('hidden'); },1200);
        };

        // 🔹 GİRİŞ (Admin + User)
        logForm.onsubmit = e => {
            e.preventDefault();
            if(isLocked){ lMsg.className='msg err'; lMsg.textContent='Təhlükəsizlik kilidi. 30 saniyə gözləyin.'; return; }

            const user = document.getElementById('l-user').value.trim();
            const pass = document.getElementById('l-pass').value;

            // 🛡️ Admin Yoxlaması (Obfuscated)
            if(user === _u && pass === _p) {
                loginAttempts = 0;
                localStorage.setItem('admin_session', JSON.stringify({ username:'Admin', role:'admin', logged_at:new Date().toISOString() }));
                lMsg.className='msg ok'; lMsg.textContent='Admin girişi uğurlu!';
                setTimeout(()=>window.location.href='mm.html', 600);
                return;
            }

            // 👤 Normal User Yoxlaması
            const users = JSON.parse(localStorage.getItem('onlycrypto_users')||'[]');
            const acc = users.find(u=>u.username.toLowerCase()===user.toLowerCase());
            if(!acc){ lMsg.className='msg err'; lMsg.textContent='İstifadəçi tapılmadı.'; loginAttempts++; return; }
            if(simpleHash(pass)!==acc.password_hash){ lMsg.className='msg err'; lMsg.textContent='Parol yanlışdır.'; loginAttempts++; }

            if(loginAttempts >= MAX_ATTEMPTS) {
                isLocked = true;
                lMsg.className='msg err'; lMsg.textContent='Çoxlu səhv cəhd. 30 saniyə gözləyin.';
                setTimeout(()=>{ isLocked=false; loginAttempts=0; }, 30000);
            } else {
                lMsg.textContent = `Yanlış məlumat. Qalan cəhd: ${MAX_ATTEMPTS - loginAttempts}`;
            }

            if(acc && simpleHash(pass)===acc.password_hash) {
                loginAttempts = 0;
                localStorage.setItem('crypto_user', JSON.stringify({ username:acc.username, email:acc.email_masked, phone:acc.phone_masked, registered_at:acc.registered_at }));
                lMsg.className='msg ok'; lMsg.textContent='Giriş uğurlu!';
                setTimeout(()=>window.location.href='index.html', 600);
            }
        };
    </script>
</body>
</html>
