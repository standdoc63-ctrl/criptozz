<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Only Crypto - Auth</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f0f0f0;
            --muted: #6b7280;
            --accent: #ef4444;
            --input-bg: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --success: #10b981;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(160deg, #0f0f0f, #181818, #0d0d0d);
            min-height: 100dvh;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
        }
        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 18px;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .field input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .switch {
            text-align: center;
            margin-top: 14px;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .switch a {
            color: #60a5fa;
            text-decoration: none;
            margin-left: 4px;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        .msg {
            text-align: center;
            font-size: 0.7rem;
            min-height: 1.1em;
            margin-top: 8px;
            word-break: break-word;
        }
        .msg.err { color: #ef4444; }
        .msg.ok { color: var(--success); }
        .admin-hint {
            text-align: center;
            font-size: 0.65rem;
            color: #3a3a3a;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- REGISTER FORM -->
        <form id="reg-form">
            <h2>Create Account</h2>
            <p class="sub">Join Only Crypto</p>
            
            <div class="field">
                <label>Username</label>
                <input type="text" id="r-user" required autocomplete="username" placeholder="Enter username">
            </div>
            <div class="field">
                <label>Email (Gmail)</label>
                <input type="email" id="r-email" required autocomplete="email" placeholder="example@gmail.com">
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="tel" id="r-phone" required autocomplete="tel" placeholder="+994 XX XXX XX XX">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="r-pass" required minlength="6" autocomplete="new-password" placeholder="Min 6 characters">
            </div>
            
            <button type="submit" class="btn">Register</button>
            <div id="r-msg" class="msg"></div>
            
            <div class="switch">
                Already have an account? <a id="to-login">Login</a>
            </div>
        </form>

        <!-- LOGIN FORM -->
        <form id="log-form" class="hidden">
            <h2>Welcome Back</h2>
            <p class="sub">Sign in to your account</p>
            
            <div class="field">
                <label>Username</label>
                <input type="text" id="l-user" required autocomplete="username" placeholder="Enter username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="l-pass" required autocomplete="current-password" placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn">Login</button>
            <div id="l-msg" class="msg"></div>
            
            <div class="switch">
                Don't have an account? <a id="to-reg">Register</a>
            </div>
        </form>

        <div class="admin-hint">🔐 Admin access available</div>
    </div>

    <script>
        // Telegram Mini App init
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // DOM Elements
        const regForm = document.getElementById('reg-form');
        const logForm = document.getElementById('log-form');
        const rMsg = document.getElementById('r-msg');
        const lMsg = document.getElementById('l-msg');

        // Toggle forms
        document.getElementById('to-login').onclick = () => {
            regForm.classList.add('hidden');
            logForm.classList.remove('hidden');
            clearMessages();
        };
        document.getElementById('to-reg').onclick = () => {
            logForm.classList.add('hidden');
            regForm.classList.remove('hidden');
            clearMessages();
        };

        function clearMessages() {
            rMsg.className = 'msg'; rMsg.textContent = '';
            lMsg.className = 'msg'; lMsg.textContent = '';
        }

        // 🔹 MASKALAMA FUNKSİYALARI
        const maskEmail = (email) => {
            if (!email || !email.includes('@')) return '***';
            const [user, domain] = email.split('@');
            const [domName, domExt] = domain.split('.');
            return `${user[0]}***@${domName[0]}***.${domExt || 'com'}`;
        };
        const maskPhone = (phone) => {
            if (!phone || phone.length < 4) return '****';
            return `${phone.slice(0, 3)}***${phone.slice(-4)}`;
        };

        // 🔹 SADƏ HASH FUNKSİYASI (Demo üçün)
        const simpleHash = (str) => {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return 'hash_' + Math.abs(hash).toString(36);
        };

        // 🔹 QEYDİYYAT
        regForm.onsubmit = (e) => {
            e.preventDefault();
            const username = document.getElementById('r-user').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const password = document.getElementById('r-pass').value;

            if (password.length < 6) {
                rMsg.className = 'msg err';
                rMsg.textContent = 'Parol ən az 6 simvol olmalıdır.';
                return;
            }

            let users = JSON.parse(localStorage.getItem('onlycrypto_users') || '[]');
            
            if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
                rMsg.className = 'msg err';
                rMsg.textContent = 'Bu istifadəçi adı artıq mövcuddur.';
                return;
            }

            users.push({
                id: Date.now(),
                username,
                email,
                email_masked: maskEmail(email),
                phone,
                phone_masked: maskPhone(phone),
                password_hash: simpleHash(password),
                registered_at: new Date().toISOString()
            });
            localStorage.setItem('onlycrypto_users', JSON.stringify(users));

            rMsg.className = 'msg ok';
            rMsg.textContent = 'Uğurla qeydiyyatdan keçdiniz!';
            setTimeout(() => {
                regForm.classList.add('hidden');
                logForm.classList.remove('hidden');
                clearMessages();
            }, 1200);
        };

        // 🔹 GİRİŞ (Admin + Normal User)
        logForm.onsubmit = (e) => {
            e.preventDefault();
            const username = document.getElementById('l-user').value.trim();
            const password = document.getElementById('l-pass').value;

            // 🛡️ ADMIN GİRİŞİ
            if (username === 'Admin' && password === 'zxcv12q') {
                localStorage.setItem('admin_session', JSON.stringify({
                    username: 'Admin',
                    role: 'admin',
                    logged_at: new Date().toISOString()
                }));
                lMsg.className = 'msg ok';
                lMsg.textContent = 'Admin girişi uğurlu! Panelə yönləndirilir...';
                setTimeout(() => window.location.href = 'mm.html', 800);
                return;
            }

            // 👤 NORMAL İSTİFADƏÇİ GİRİŞİ
            const users = JSON.parse(localStorage.getItem('onlycrypto_users') || '[]');
            const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

            if (!user) {
                lMsg.className = 'msg err';
                lMsg.textContent = 'İstifadəçi tapılmadı.';
                return;
            }
            if (simpleHash(password) !== user.password_hash) {
                lMsg.className = 'msg err';
                lMsg.textContent = 'Parol yanlışdır.';
                return;
            }

            const sessionUser = {
                username: user.username,
                email: user.email_masked,
                phone: user.phone_masked,
                registered_at: user.registered_at
            };
            localStorage.setItem('crypto_user', JSON.stringify(sessionUser));

            lMsg.className = 'msg ok';
            lMsg.textContent = 'Giriş uğurlu! Yönləndirilir...';
            setTimeout(() => window.location.href = 'index.html', 800);
        };
    </script>
</body>
</html>
